# 心创云盘（https://shouyulove.cn/drive/）Nginx 配置片段
# 引入于 /etc/nginx/sites-available/shouyulove 的 shouyulove.cn server 块内。

location = /drive {
    return 308 https://shouyulove.cn/drive/$is_args$args;
}

# 门户与 Agent API：关闭共享 access_log 防止路径/查询参数或运维操作流水泄露；鉴权通过后置空 X-Shouyu-* 防止伪造。
location ^~ /drive/api/ {
    if ($scheme = http) {
        return 308 https://shouyulove.cn$request_uri;
    }
    if ($host != shouyulove.cn) {
        return 308 https://shouyulove.cn$request_uri;
    }
    access_log off;
    auth_request /_syl_auth_optional;
    auth_request_set $syl_drive_user_id $upstream_http_x_shouyu_user_id;
    auth_request_set $syl_drive_user_phone $upstream_http_x_shouyu_user_phone;
    auth_request_set $syl_drive_user_phone_hash $upstream_http_x_shouyu_user_phone_hash;
    auth_request_set $syl_drive_user_created_at $upstream_http_x_shouyu_user_created_at;

    limit_conn syl_conn 48;
    client_max_body_size 20G;
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /drive;
    proxy_set_header X-Shouyu-From-Nginx "1";
    proxy_set_header X-Shouyu-User-Id $syl_drive_user_id;
    proxy_set_header X-Shouyu-User-Phone $syl_drive_user_phone;
    proxy_set_header X-Shouyu-User-Phone-Hash $syl_drive_user_phone_hash;
    proxy_set_header X-Shouyu-User-Created-At $syl_drive_user_created_at;
}

# FileBrowser 文件管理面板与大文件分片上传通道（最高支持 20GB 单次上传，流式不落盘缓冲）
location ^~ /drive/files/ {
    if ($scheme = http) {
        return 308 https://shouyulove.cn$request_uri;
    }
    if ($host != shouyulove.cn) {
        return 308 https://shouyulove.cn$request_uri;
    }
    access_log off;
    auth_request /_syl_auth_optional;
    auth_request_set $syl_drive_user_id $upstream_http_x_shouyu_user_id;
    auth_request_set $syl_drive_user_phone $upstream_http_x_shouyu_user_phone;
    auth_request_set $syl_drive_user_phone_hash $upstream_http_x_shouyu_user_phone_hash;
    auth_request_set $syl_drive_user_created_at $upstream_http_x_shouyu_user_created_at;

    limit_conn syl_conn 48;
    client_max_body_size 20G;
    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /drive;
    proxy_set_header X-Shouyu-From-Nginx "1";
    proxy_set_header X-Shouyu-User-Id $syl_drive_user_id;
    proxy_set_header X-Shouyu-User-Phone $syl_drive_user_phone;
    proxy_set_header X-Shouyu-User-Phone-Hash $syl_drive_user_phone_hash;
    proxy_set_header X-Shouyu-User-Created-At $syl_drive_user_created_at;
}

# 心创云盘门户入口页面（继承 server 级统计访问日志）
location ^~ /drive/ {
    if ($scheme = http) {
        return 308 https://shouyulove.cn$request_uri;
    }
    if ($host != shouyulove.cn) {
        return 308 https://shouyulove.cn$request_uri;
    }
    auth_request /_syl_auth_optional;
    auth_request_set $syl_drive_user_id $upstream_http_x_shouyu_user_id;
    auth_request_set $syl_drive_user_phone $upstream_http_x_shouyu_user_phone;
    auth_request_set $syl_drive_user_phone_hash $upstream_http_x_shouyu_user_phone_hash;
    auth_request_set $syl_drive_user_created_at $upstream_http_x_shouyu_user_created_at;

    limit_req zone=syl_req burst=80 nodelay;
    limit_conn syl_conn 32;
    client_max_body_size 2M;

    proxy_pass http://127.0.0.1:8768;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /drive;
    proxy_set_header X-Shouyu-From-Nginx "1";
    proxy_set_header X-Shouyu-User-Id $syl_drive_user_id;
    proxy_set_header X-Shouyu-User-Phone $syl_drive_user_phone;
    proxy_set_header X-Shouyu-User-Phone-Hash $syl_drive_user_phone_hash;
    proxy_set_header X-Shouyu-User-Created-At $syl_drive_user_created_at;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
}
